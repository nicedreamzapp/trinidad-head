<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="c"><rect width="1024" height="1024" rx="228"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a2a"/><stop offset="0.62" stop-color="#1d2a3f"/><stop offset="1" stop-color="#27425a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#5fd4c0" stop-opacity="0.35"/><stop offset="1" stop-color="#5fd4c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15506a"/><stop offset="1" stop-color="#0a1f30"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8f68"/><stop offset="1" stop-color="#1c4a3a"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6b50"/><stop offset="1" stop-color="#153628"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ad74"/><stop offset="1" stop-color="#ead39a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <!-- sea -->
    <rect y="680" width="1024" height="344" fill="url(#sea)"/>
    <!-- headland: Trinidad Head's rounded dome -->
    <path d="M430 700 C 450 560, 540 430, 680 420 C 800 412, 880 500, 930 600 C 950 640, 970 680, 1000 700 Z" fill="url(#head)"/>
    <path d="M520 560 C 580 480, 660 452, 740 470" stroke="#62b88f" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- lighthouse -->
    <rect x="828" y="512" width="26" height="62" rx="4" fill="#eef2f5"/>
    <rect x="824" y="500" width="34" height="16" rx="5" fill="#d9dee4"/>
    <circle cx="841" cy="492" r="34" fill="#ffd27a" opacity="0.55" filter="url(#soft)"/>
    <circle cx="841" cy="494" r="9" fill="#ffe3a3"/>
    <!-- mainland -->
    <path d="M0 610 C 90 600, 170 640, 230 700 L 0 700 Z" fill="url(#land)"/>
    <!-- the tombolo: sand strip tying the head to the mainland -->
    <path d="M150 704 C 260 690, 360 716, 470 700 L 470 724 C 360 740, 250 716, 150 728 Z" fill="url(#sand)"/>
    <!-- waves -->
    <g stroke="#7fd3e0" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.45">
      <path d="M90 800 q 40 -22 80 0 t 80 0"/>
      <path d="M560 790 q 40 -22 80 0 t 80 0 t 80 0"/>
      <path d="M300 880 q 40 -22 80 0 t 80 0 t 80 0"/>
      <path d="M700 910 q 40 -22 80 0 t 80 0"/>
    </g>
    <!-- window dots, like the terminal -->
    <circle cx="150" cy="150" r="26" fill="#ff5f57"/>
    <circle cx="228" cy="150" r="26" fill="#febc2e"/>
    <circle cx="306" cy="150" r="26" fill="#28c840"/>
    <!-- prompt -->
    <text x="138" y="430" font-family="Menlo, monospace" font-weight="700" font-size="230" fill="#7ee6cc" filter="url(#soft)" opacity="0.6">&gt;_</text>
    <text x="138" y="430" font-family="Menlo, monospace" font-weight="700" font-size="230" fill="#9ff3dc">&gt;_</text>
  </g>
</svg>
